# SHADOWLINE CI — the single required status check for branch protection.
#
# Runs on every push to dev/staging/main and on PRs targeting them.
# Single job `ci` by design: branch protection requires one stable check
# context (`ci`), not a matrix of per-suite names that drift over time.
#
# No secrets required: the demo tier signs sessions with a CI-only
# SESSION_SECRET injected per job.
name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SESSION_SECRET: ci-only-session-secret
  NODE_ENV: production

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: JS unit tests
        run: bun test tests/js
      - name: Dependency vulnerability scan (OSV.dev)
        run: bun run audit:deps
      - name: Production build
        run: bun run build

      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Pytest suite
        run: python -m pytest tests/ -q
      - name: Preflight honest-failure smoke (no dataset in CI)
        run: |
          rc=0; python -m shadowline preflight || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "preflight must exit 1 when the dataset is absent (got $rc)"; exit 1
          fi
          echo "preflight correctly reports the missing dataset (exit 1)"
      - name: Verify no secrets or datasets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^download/|^backups/|^data/|\.duckdb$'; then
            echo "::error::sensitive path tracked in git"; exit 1
          fi
          echo "clean: no tracked secrets/datasets"
